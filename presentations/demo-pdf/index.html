<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The reveal.js demo as an exported PDF: five slides shown page by page, so exported presentations live in the garage too."
    />
    <meta name="date" content="2026-08-18" />
    <title>PDF Demo</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100'
        height='100' rx='16' fill='%23b03a2e'/><rect x='26' y='22' width='48' height='58' rx='4'
        fill='%23fdf6ec'/></svg>"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #14110f;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100vw;
        max-height: 100vh;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }
      #page-count {
        position: fixed;
        right: 16px;
        bottom: 12px;
        color: #b8ada4;
        font:
          13px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="page-count"></div>

    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

      const canvas = document.querySelector("#canvas");
      const context = canvas.getContext("2d");
      const counter = document.querySelector("#page-count");
      let document_ = null;
      let current = 1;
      let rendering = null;

      async function show(number) {
        if (!document_) return;
        current = Math.min(Math.max(number, 1), document_.numPages);
        const page = await document_.getPage(current);
        const unscaled = page.getViewport({ scale: 1 });
        const fit = Math.min(innerWidth / unscaled.width, innerHeight / unscaled.height);
        const viewport = page.getViewport({
          scale: fit * (devicePixelRatio || 1),
        });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = `${unscaled.width * fit}px`;
        canvas.style.height = `${unscaled.height * fit}px`;
        rendering?.cancel();
        rendering = page.render({ canvasContext: context, viewport });
        await rendering.promise.catch(() => {}); // a superseded render rejects
        counter.textContent = `${current} / ${document_.numPages}`;
      }

      addEventListener("keydown", (event) => {
        const step = {
          ArrowRight: 1,
          ArrowDown: 1,
          PageDown: 1,
          " ": 1,
          ArrowLeft: -1,
          ArrowUp: -1,
          PageUp: -1,
        }[event.key];
        if (!step) return;
        event.preventDefault();
        show(current + step);
      });

      addEventListener("click", (event) => show(current + (event.clientX < innerWidth / 2 ? -1 : 1)));
      addEventListener("resize", () => show(current));

      // same {method, args} contract reveal.js exposes, so the garage can preview this presentation
      addEventListener("message", (event) => {
        let command;
        try {
          command = JSON.parse(event.data);
        } catch {
          return;
        }
        if (command.method === "next") show(current + 1);
        else if (command.method === "prev") show(current - 1);
        else if (command.method === "slide") show((command.args?.[0] ?? 0) + 1);
      });

      pdfjsLib.getDocument("slides.pdf").promise.then((loaded) => {
        document_ = loaded;
        show(1);
      });
    </script>
  </body>
</html>
