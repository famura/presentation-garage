<!DOCTYPE html>
<meta charset="utf-8" />

<!-- =============================================================================================================== -->

<head>
  <!-- Link custom css files (not necessary?!) -->
  <!-- <link rel="stylesheet" href="dist/reveal.css" /> -->
  <!-- <link rel="stylesheet" href="dist/theme/famura.css" id="theme" /> -->

  <style type="text/css">
    .node {
      color: #f2f2f2;
      fill: azure;
      font: inherit;
      font-weight: lighter;
    }
    .link {
      stroke: rgb(246, 178, 107);
      stroke-opacity: 1;
      stroke-width: 4px;
    }
    .dashed {
      stroke-dasharray: 6, 4;
    }
    .famurabrightred {
      stroke: #ee4422;
    }
    .famurabrightgreen {
      stroke: #bdecb6;
    }
    .bolder {
      font-weight: bolder;
    }
  </style>
</head>

<!-- =============================================================================================================== -->

<body>
  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg-full.js"></script>
  <script type="text/javascript" src="../../slide-graph.js"></script>
  <!-- THIS PATH MUST BE SET: relative to this file, or relative to root ('/slide-graph.js') -->

  <script>
    var width = 960,
      height = 650, // reveal.js slide width is 960px and slide height is 700px; leave some space for the heading
      baselineSkip = 30 // to be used in the associated <NAME>-graph.json file

    // NOTE:
    // Three ways to provide graph data:
    // 1. In index.html, add `data-graph="filename.json"` to the slide including this file
    // 2. Load a json file directly here:
    //    d3.json("spota-graph.json").then(function(data) {
    //      loadGraph(data);
    //    });
    // 3. Construct the data here and pass it to `loadGraph`:
    //     var data = { nodes: [
    //                     {id: "test1", opacity: 1, fx: 200, fy: 160, labels: [{text: "Test1"}]},
    //                     {id: "test2", opacity: 1, fx: 400, fy: 200, labels: [{text: "Test2"}]}
    //                  ],
    //                  links: [
    //                     {source: "test1", target: "test2", type: "A"},
    //                     {source: "test2", target: "test1", type: "B"}
    //                  ]
    //                 };
    //     loadGraph(data);

    data = {
      nodes: [
        {
          id: "sample_init",
          opacity: 1,
          fx: 140,
          fy: 50,
          labels: [{text: "sample initial domain"}, {text: "parameter distributions", offset: "0, baselineSkip"}, {math: "\\phi_{1:n_{\\textsf{init}}}", offset: "30, baselineSkip + 16"}],
        },
        {
          id: "train_init",
          opacity: 0,
          fx: 150,
          fy: 250,
          labels: [{text: "train policies in"}, {text: "randomized simulations", offset: "0, baselineSkip"}, {math: "\\theta^{\\star}_{1:n_{\\textsf{init}}}", offset: "+30, baselineSkip + 14"}],
          // math: "\\theta^{\\star}_{1:n_{\\textsf{init}}}\\!\\gets \\texttt{PolOpt}\\!\\left[ \\pi(\\theta_{1:n_{\\textsf{init}}}), p_{\\phi_{1:n_{\\textsf{init}}}}(\\xi) \\right]",
        },
        {
          id: "eval_init",
          opacity: 0,
          fx: 250,
          fy: 450,
          labels: [
            {text: "evaluate policies on", class: "bolder"},
            {text: "physical platform", offset: "0, baselineSkip", class: "bolder"},
            {math: "\\hat{J}^{\\textsf{real}}(\\theta^{\\star}_{1:n_{\\textsf{init}}})", offset: "-80, baselineSkip + 10"},
          ],
        },
        {
          id: "update_GP",
          opacity: 0,
          fx: 730,
          fy: 540,
          labels: [{text: "update GP"}, {math: "\\mathcal{D} \\cup \\left\\lbrace \\phi, \\hat{J}^{\\textsf{real}} \\right\\rbrace ", offset: "-100, 14"}],
        },
        {
          id: "acquisition",
          opacity: 0,
          fx: 830,
          fy: 330,
          labels: [{text: "acquire new"}, {text: "distribution using BO", offset: "0, baselineSkip"}, {math: "\\phi^{\\star}", offset: "10, baselineSkip + 16"}],
        },
        {
          id: "train_loop",
          opacity: 0,
          fx: 880,
          fy: 100,
          labels: [{text: "train policy"}, {text: "in simulation", offset: "0, baselineSkip"}, {math: "\\theta^{\\star}", offset: "10, baselineSkip + 16"}],
        },
        {
          id: "eval_loop",
          opacity: 0,
          fx: 550,
          fy: 120,
          labels: [
            {text: "evaluate policy on", class: "bolder"},
            {text: "physical platform", offset: "0, baselineSkip", class: "bolder"},
            {math: "\\hat{J}^{\\textsf{real}}(\\theta^{\\star})", offset: "0, baselineSkip + 10"},
          ],
        },
        {
          id: "big_enough",
          opacity: 0,
          fx: 500,
          fy: 330,
          labels: [{text: "big enough?"}],
        },
        {
          id: "done",
          opacity: 0,
          fx: 360,
          fy: 50,
          // class: "green",
          labels: [{text: "done"}],
        },
      ],
      links: [
        {
          source: "sample_init",
          target: "train_init",
          waypoints: [
            [140, 120],
            [160, 170],
          ],
        },
        {source: "train_init", target: "eval_init", waypoints: [[160, 340]]},
        {source: "eval_init", target: "update_GP", waypoints: [[500, 520]]},
        {source: "update_GP", target: "acquisition", waypoints: [[800, 450]]},
        {
          source: "acquisition",
          target: "train_loop",
          waypoints: [
            [840, 250],
            [860, 205],
          ],
        },
        {source: "train_loop", target: "eval_loop", waypoints: [[740, 105]]},
        {source: "eval_loop", target: "big_enough", waypoints: [[505, 210]]},
        {source: "big_enough", target: "done", class: "famurabrightgreen", waypoints: [[380, 200]]},
        {source: "big_enough", target: "update_GP", class: "famurabrightred", waypoints: [[560, 430]]},
      ],
    }
    loadGraph(data)

    // NOTE:
    // Slide transitions are defined here. Each transition is actually just a small lambda function. For both forward and
    // backward steps through the presentation to work, you need to define a function both for each transition AND one
    // to un-do each transition (but the backward steps ARE optional if you don't care).

    // NOTE:
    // When you move INTO this slide by going BACKWARDS through the presentation, the LAST `transitionForward()`
    // will be invoked. This gives you the chance to build the final slide state and keep everything nice and continuous.
    // This is why the last transition below enables ALL nodes instead of just the last one. Here I have provided a small
    // function which will toggle the visibility of a node, using its index in data.nodes[] above. Arrow visibility is
    // automatically set based on whether the nodes the arrow connects are visible. e.g. `showNode(2, true)` will make
    // the "evaluate in reference domains" node visible along with any arrows that connect this node to another visible node.

    _transitions = [
      {
        transitionForward: () => {
          showNodes([1], true)
        },
        transitionBackward: () => showNodes([1], false),
        index: 0,
      },
      {
        transitionForward: () => showNode(2, true),
        transitionBackward: () => showNode(2, false),
      },
      {
        transitionForward: () => showNode(3, true),
        transitionBackward: () => showNode(3, false),
      },
      {
        transitionForward: () => showNode(4, true),
        transitionBackward: () => showNode(4, false),
      },
      {
        transitionForward: () => showNode(5, true),
        transitionBackward: () => showNode(5, false),
      },
      {
        transitionForward: () => showNode(6, true),
        transitionBackward: () => showNode(6, false),
      },
      {
        transitionForward: () => showNodes([7, 8], true),
        transitionBackward: () => showNodes([7, 8], false),
      },
      {
        transitionForward: () => showNodes([0, 1, 2], false, 100),
        transitionBackward: () => showNodes([2, 1, 0], true, 100),
      },
      {
        transitionForward: () => {
          showNodes([2, 1, 0], false, 100) // ensure first 3 nodes are hidden
          showNodes([8, 7, 6, 5, 4, 3], true, 100) // ensure remaining nodes are visible
          d3.select(".link").classed("dashed", true).transition().duration(5000).ease(d3.easeBackOut).attr("stroke-dashoffset", -150)
        },
        transitionBackward: () => {
          d3.select(".link").classed("dashed", false).transition().duration(5000).ease(d3.easeBackOut).attr("stroke-dashoffset", 0)
        },
      },
    ]

    document.addEventListener("keydown", function (e) {
      if (e.key == "o") {
        showAllNodes(true)
      }
    })
  </script>

  <!-- ============================================================================================================= -->
</body>
