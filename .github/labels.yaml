- name: "area: backbone"
  color: "#4dff4d"
  description: "Scripts, tasks, and git config"
- name: "area: garage"
  color: "#88ff4d"
  description: "Landing page, presentation folders under presentations/, and garage.json"
- name: "area: skills"
  color: "#c4ff4d"
  description: "Agent skills under .agents/"
- name: "area: docs"
  color: "#ffe14d"
  description: "Readme and other documentation"
- name: "area: repo"
  color: "#4dffc4"
  description: "Tooling, workflows, or the repository itself"

- name: "priority: critical"
  color: "#ff4d4d"
  description: "Needs immediate attention"
- name: "priority: medium"
  color: "#ff884d"
  description: "Should be addressed soon"
- name: "priority: low"
  color: "#ffc34d"
  description: "Can be addressed later"

- name: "type: bug"
  color: "#da0b0b"
  description: "Something isn't working"
- name: "type: fix"
  color: "#98d017"
  description: "This fixes a bug"
- name: "type: feature"
  color: "#884dff"
  description: "New feature or feature request"
- name: "type: documentation"
  color: "#c44dff"
  description: "Improvements or additions to documentation"
- name: "type: refactor"
  color: "#4d88ff"
  description: "Refactoring without functional changes"
- name: "type: discussion"
  color: "#ff4dc4"
  description: "General discussion or question"
- name: "type: misc"
  color: "#4d4dff"
  description: "Everything else"

# applied by check-pr.yaml, listed here so the label sync does not delete them
- name: "size: xs"
  color: "#ededed"
- name: "size: s"
  color: "#d4d4d4"
- name: "size: m"
  color: "#bcbcbc"
- name: "size: l"
  color: "#a3a3a3"
- name: "size: xl"
  color: "#8a8a8a"
- name: "size: xxl"
  color: "#717171"
